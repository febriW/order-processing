global:
  scrape_interval: 15s

scrape_configs:
  - job_name: auth_service
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth_service:8081

  - job_name: product_service
    metrics_path: /metrics
    static_configs:
      - targets:
          - product_service:8082

  - job_name: order_service
    metrics_path: /metrics
    static_configs:
      - targets:
          - order_service:8083
