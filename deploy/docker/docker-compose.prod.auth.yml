name: be-order-processing-auth

services:
  auth_service:
    build:
      context: ../..
      dockerfile: service/auth/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${AUTH_PORT:-8081}:8081"
    restart: unless-stopped
