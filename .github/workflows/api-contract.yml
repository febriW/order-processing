name: API Contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify-api-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate Swagger Specs
        run: make swagger

      - name: Fail If Swagger Artifacts Changed
        run: git diff --exit-code docs/swagger

      - name: KrakenD Contract Check
        run: make contract-check
