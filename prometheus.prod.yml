global:
  scrape_interval: 15s

scrape_configs:
  - job_name: auth_service
    metrics_path: /metrics
    static_configs:
      - targets:
          - 10.0.1.11:8081

  - job_name: product_service
    metrics_path: /metrics
    static_configs:
      - targets:
          - 10.0.1.12:8082

  - job_name: order_service
    metrics_path: /metrics
    static_configs:
      - targets:
          - 10.0.1.13:8083
