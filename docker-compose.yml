name: be-order-processing

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.9-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------
  # KrakenD API GATEWAY
  # ------------------------------------------
  krakend:
    build: ./api-gateway
    ports:
      - "${KRAKEND_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      - auth_service
      - product_service
      - order_service

  # ------------------------------------------
  # MICROSERVICES
  # ------------------------------------------
  auth_service:
    build:
      context: .
      dockerfile: service/auth/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-ecommerce_db}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
    expose:
      - "8081"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy

  product_service:
    build:
      context: .
      dockerfile: service/product/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-ecommerce_db}?sslmode=disable
      AUTH_VALIDATE_URL: http://auth_service:8081/auth/validate
    expose:
      - "8082"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth_service:
        condition: service_started

  order_service:
    build:
      context: .
      dockerfile: service/order/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-ecommerce_db}?sslmode=disable
      AUTH_VALIDATE_URL: http://auth_service:8081/auth/validate
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
    expose:
      - "8083"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth_service:
        condition: service_started
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy

  # ------------------------------------------
  # MONITORING
  # ------------------------------------------
  prometheus:
    image: prom/prometheus:v2.37.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:9.2.3
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus

  swagger_ui:
    image: swaggerapi/swagger-ui:v5.28.1
    ports:
      - "8088:8080"
    environment:
      URLS: '[{"url":"/spec/swagger.json","name":"All APIs"},{"url":"/spec/auth/swagger.json","name":"Auth API"},{"url":"/spec/product/swagger.json","name":"Product API"},{"url":"/spec/order/swagger.json","name":"Order API"}]'
      URLS_PRIMARY_NAME: "All APIs"
    volumes:
      - ./docs/swagger:/usr/share/nginx/html/spec:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
